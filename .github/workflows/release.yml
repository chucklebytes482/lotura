name: Lotura permanent-key release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_SLUG: "lotura"
  APP_DISPLAY_NAME: "Lotura"
  EXPECTED_CERT_SHA256: "642247d97699bfdb0ee4c19369bf501081ca3fb424ded71fe63997892019948e"

jobs:
  release:
    name: Test & Build Permanent-Key arm64-v8a APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Version (preserve monotonic code when replacing workflow)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Preserve monotonic 1.0.N versioning across existing tags
          MAX=$(gh api --paginate "repos/$GITHUB_REPOSITORY/tags?per_page=100" --jq '.[].name' | sed -nE 's/^v1\.0\.([0-9]+)$/\1/p' | sort -n | tail -n 1)
          NEXT=$(( ${MAX:-0} + 1 ))
          if (( GITHUB_RUN_NUMBER > NEXT )); then NEXT=$GITHUB_RUN_NUMBER; fi
          echo "CI_VERSION_CODE=$((1 + NEXT))" >> "$GITHUB_ENV"
          echo "CI_VERSION_NAME=1.0.$NEXT" >> "$GITHUB_ENV"
          echo "VERSION_TAG=v1.0.$NEXT" >> "$GITHUB_ENV"
          echo "Release version: v1.0.${NEXT} (versionCode=$((1 + NEXT)))"

      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)
          test -n "$SDKMANAGER"
          (yes || true) | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'platforms;android-36.1' 'build-tools;36.0.0'
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

      - name: Require permanent signing key (fail-closed)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          for VAR in RELEASE_KEYSTORE_BASE64 STORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [[ -z "${!VAR}" ]]; then
              echo "::error::Missing signing secret: $VAR"
              exit 1
            fi
          done

          CLEAN_ALIAS=$(printf '%s' "$KEY_ALIAS" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          [[ "$CLEAN_ALIAS" == upload ]] || { echo '::error::KEY_ALIAS must be upload'; exit 1; }

          printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/upload.jks"
          if ! KEYTOOL_OUT=$(keytool -list -keystore "$RUNNER_TEMP/upload.jks" -alias upload -storepass:env STORE_PASSWORD 2>&1); then
            echo "::error::Gagal memverifikasi keystore release (cek STORE_PASSWORD / alias upload):"
            echo "$KEYTOOL_OUT"
            exit 1
          fi
          echo "Permanent release keystore verified (alias: upload)."
          echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

          # Ensure debug.keystore exists on CI runner for debug unit tests only
          if [[ ! -f debug.keystore ]]; then
            if [[ -f debug.keystore.base64 ]]; then
              tr -d '[:space:]' < debug.keystore.base64 | base64 --decode > debug.keystore
              echo "Decoded debug.keystore from debug.keystore.base64."
            else
              keytool -genkeypair \
                -keystore debug.keystore \
                -alias androiddebugkey \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass android -keypass android \
                -dname "CN=Android Debug, O=Android, C=US" >/dev/null 2>&1
              echo "Generated ephemeral CI debug.keystore for unit tests."
            fi
          fi

      - name: Unit and Robolectric tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build R8 arm64 APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify permanent certificate and package artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="${APP_SLUG}-${VERSION_TAG}-arm64-v8a-release.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "dist/$APK" | tee dist/CERT_FINGERPRINT.txt
          ACTUAL=$(sed -n 's/.*certificate SHA-256 digest: //p' dist/CERT_FINGERPRINT.txt | sort -u | tr -d ':\r\n[:space:]' | tr '[:upper:]' '[:lower:]')
          [[ -n "$ACTUAL" && "$ACTUAL" == "$EXPECTED_CERT_SHA256" ]] || {
            echo "::error::Unexpected APK signing certificate! Expected: $EXPECTED_CERT_SHA256, Actual: $ACTUAL"
            exit 1
          }
          (cd dist && sha256sum "$APK" > CHECKSUMS.txt)
          ls -lh "dist/$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: lotura-release
          path: dist/*

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: ${{ env.APP_DISPLAY_NAME }} ${{ env.VERSION_TAG }}
          files: dist/*
          generate_release_notes: true

      - name: Clean private key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/upload.jks"
